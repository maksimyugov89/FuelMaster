name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия Flutter зафиксирована под ту, которой собирается релиз
      # (локально: Flutter 3.38.5 stable) — иначе анализатор шумит на разнице версий.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      # --fatal-infos: в проекте ноль замечаний анализатора (пункт C-1 аудита),
      # и это удерживается: любое info-замечание роняет сборку.
      - name: Анализ
        run: flutter analyze --fatal-infos

      - name: Тесты
        run: flutter test --reporter expanded
